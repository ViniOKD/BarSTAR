services:
  db:
    image: mysql:8.4

    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?Defina MYSQL_DATABASE no .env}
      MYSQL_USER: ${MYSQL_USER:?Defina MYSQL_USER no .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Defina MYSQL_PASSWORD no .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no .env}

    # preserva os dados entre reinicializações
    volumes:
      - mysql_data:/var/lib/mysql

    # verifica se o banco aceita consultas
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          MYSQL_PWD="$${MYSQL_PASSWORD}"
          mysql --protocol=TCP -h 127.0.0.1
          -u "$${MYSQL_USER}" "$${MYSQL_DATABASE}"
          -e "SELECT 1" >/dev/null 2>&1
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  # API Django
  backend:
    build: ./backend

    env_file:
      - .env

    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"

    ports:
      - "127.0.0.1:8000:8000"

    # disponibiliza o código local dentro do container
    volumes:
      - ./backend:/app

    # aguarda o MySQL ficar pronto
    depends_on:
      db:
        condition: service_healthy

  # interface React
  frontend:
    build: ./frontend

    ports:
      - "127.0.0.1:5173:5173"

    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

    # atualiza as dependências e inicia o Vite
    command: >
      sh -c "npm ci &&
      npm run dev -- --host 0.0.0.0 --port 5173 --strictPort"

# volumes gerenciados pelo Docker
volumes:
  mysql_data:
  frontend_node_modules: